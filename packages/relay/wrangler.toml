name = "activitypub-relay"
main = "src/server.ts"
compatibility_date = "2026-05-09"
compatibility_flags = [ "nodejs_compat_v2", "enable_nodejs_fs_module" ]
preview_urls = false
workers_dev = false

# Static assets configuration
# Using the new Workers Assets feature
[assets]
directory = "public"
binding = "ASSETS"

[vars]
HOSTNAME = "relay-test.mattyaski.co"

[[d1_databases]]
binding = "DB"
database_id = "0c4a4930-3e25-465a-a322-775bb61eed84"

[observability.logs]
enabled = true

[observability.traces]
enabled = true
